name: One-time lockfile bootstrap
# Temporary S0 workflow. Delete this after package-lock.json lands in the branch.
on:
  push:
    branches: [feat/s0-durable-sandbox-spike]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/s0-durable-sandbox-spike
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Commit reproducible dependency lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile already committed"; exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(s0): commit resolved dependency lockfile"
          # The S0 branch may advance while npm resolves packages. Rebase
          # the generated lockfile onto its latest HEAD before pushing.
          for attempt in 1 2 3; do
            git fetch origin feat/s0-durable-sandbox-spike
            if git cat-file -e origin/feat/s0-durable-sandbox-spike:package-lock.json 2>/dev/null; then
              echo "Another job committed the lockfile; nothing to do"
              exit 0
            fi
            git rebase origin/feat/s0-durable-sandbox-spike
            if git push origin HEAD:refs/heads/feat/s0-durable-sandbox-spike; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push lockfile after retries" >&2
          exit 1
